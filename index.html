<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTP OCR Extractor - Gemini AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-id-card text-blue-600"></i> Extractor Data KTP
                </h1>
                <p class="text-sm text-slate-500 mt-1">Ekstrak data foto KTP secara instan menggunakan Gemini AI</p>
            </div>
            
            <!-- API Key Input -->
            <div class="w-full md:w-80">
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Gemini API Key</label>
                <div class="relative">
                    <input type="password" id="apiKey" placeholder="Paste API Key di sini..." 
                        class="w-full pl-3 pr-10 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <button onclick="toggleApiKeyVisibility()" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
                        <i id="eyeIcon" class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Panel Upload & Preview -->
            <div class="lg:col-span-5 space-y-4">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold mb-4 text-slate-800">1. Unggah Foto KTP</h2>
                    
                    <div id="dropZone" class="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-xl p-6 text-center cursor-pointer transition bg-slate-50 hover:bg-blue-50/30">
                        <input type="file" id="ktpInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                        <i class="fa-solid fa-cloud-arrow-up text-4xl text-slate-400 mb-2"></i>
                        <p class="text-sm font-medium text-slate-700">Klik atau seret foto KTP ke sini</p>
                        <p class="text-xs text-slate-400 mt-1">Format: JPG, JPEG, PNG</p>
                    </div>

                    <!-- Image Preview -->
                    <div id="previewContainer" class="mt-4 hidden">
                        <p class="text-xs font-semibold text-slate-500 mb-2">Pratinjau Foto:</p>
                        <img id="imagePreview" src="" class="w-full rounded-lg border border-slate-200 max-h-64 object-contain bg-slate-900">
                    </div>

                    <button id="btnProcess" onclick="processImage()" disabled
                        class="w-full mt-4 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-semibold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-bolt"></i>
                        <span>Ekstrak Data KTP</span>
                    </button>
                </div>
            </div>

            <!-- Panel Hasil Ekstraksi -->
            <div class="lg:col-span-7">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="text-lg font-bold text-slate-800">2. Hasil Data</h2>
                        <button onclick="copyAllText()" class="text-xs bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg font-medium transition flex items-center gap-1.5">
                            <i class="fa-regular fa-copy"></i> Salin Semua (Format Teks)
                        </button>
                    </div>

                    <!-- Loading Indicator -->
                    <div id="loading" class="hidden py-12 text-center">
                        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent mb-2"></div>
                        <p class="text-sm text-slate-600 font-medium">Menganalisis foto KTP...</p>
                    </div>

                    <!-- Form Fields -->
                    <div id="formFields" class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                        <!-- Generated Dynamically -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const fieldsConfig = [
            { id: 'nik', label: 'NIK', fullWidth: true },
            { id: 'nama', label: 'Nama Lengkap', fullWidth: true },
            { id: 'tempat_tgl_lahir', label: 'Tempat / Tgl Lahir', fullWidth: false },
            { id: 'jenis_kelamin', label: 'Jenis Kelamin', fullWidth: false },
            { id: 'gol_darah', label: 'Gol. Darah', fullWidth: false },
            { id: 'agama', label: 'Agama', fullWidth: false },
            { id: 'alamat', label: 'Alamat Lengkap', fullWidth: true },
            { id: 'status_perkawinan', label: 'Status Perkawinan', fullWidth: false },
            { id: 'pekerjaan', label: 'Pekerjaan', fullWidth: true },
            { id: 'kewarganegaraan', label: 'Kewarganegaraan', fullWidth: false },
            { id: 'berlaku_hingga', label: 'Berlaku Hingga', fullWidth: false },
        ];

        // Init UI Fields
        const formContainer = document.getElementById('formFields');
        fieldsConfig.forEach(field => {
            const wrapper = document.createElement('div');
            if (field.fullWidth) wrapper.classList.add('md:col-span-2');

            wrapper.innerHTML = `
                <label class="block text-xs font-semibold text-slate-500 mb-1">${field.label}</label>
                <div class="flex gap-1.5">
                    <input type="text" id="field_${field.id}" placeholder="-" 
                        class="w-full px-3 py-2 border border-slate-200 rounded-lg bg-slate-50 font-medium text-slate-800 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <button onclick="copySingleField('field_${field.id}', this)" title="Salin" 
                        class="px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-200 transition text-xs font-medium flex items-center justify-center">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
            `;
            formContainer.appendChild(wrapper);
        });

        // Load saved API Key
        const apiKeyInput = document.getElementById('apiKey');
        apiKeyInput.value = localStorage.getItem('ktp_gemini_api_key') || '';
        apiKeyInput.addEventListener('input', () => {
            localStorage.setItem('ktp_gemini_api_key', apiKeyInput.value.trim());
        });

        function toggleApiKeyVisibility() {
            const icon = document.getElementById('eyeIcon');
            if (apiKeyInput.type === 'password') {
                apiKeyInput.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                apiKeyInput.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }

        // Drag & Drop
        const dropZone = document.getElementById('dropZone');
        const ktpInput = document.getElementById('ktpInput');

        dropZone.addEventListener('click', () => ktpInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('bg-blue-100/50'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('bg-blue-100/50'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-blue-100/50');
            if (e.dataTransfer.files.length) {
                ktpInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });

        let selectedBase64 = null;
        let selectedMimeType = 'image/jpeg';

        function handleFileSelect() {
            const file = ktpInput.files[0];
            if (!file) return;

            selectedMimeType = file.type || 'image/jpeg';
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedBase64 = e.target.result.split(',')[1];
                document.getElementById('imagePreview').src = e.target.result;
                document.getElementById('previewContainer').classList.remove('hidden');
                document.getElementById('btnProcess').disabled = false;
            };
            reader.readAsDataURL(file);
        }

        async function processImage() {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                alert('Silakan masukkan Gemini API Key Anda terlebih dahulu!');
                return;
            }
            if (!selectedBase64) return;

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('btnProcess').disabled = true;

            const promptText = `Ekstrak data KTP dari gambar ini secara presisi ke format JSON murni. 
Gunakan key JSON berikut persis (semua value string):
{
  "nik": "",
  "nama": "",
  "tempat_tgl_lahir": "",
  "jenis_kelamin": "",
  "gol_darah": "",
  "agama": "",
  "alamat": "",
  "status_perkawinan": "",
  "pekerjaan": "",
  "kewarganegaraan": "",
  "berlaku_hingga": ""
}
PENTING UNTUK BIDANG "alamat": Gabungkan seluruh informasi lokasi pada KTP (Jalan/Dusun, RT/RW, Kel/Desa, dan Kecamatan) menjadi satu baris teks alamat lengkap yang utuh (contoh: "JL. SUDIRMAN NO. 12 RT 002/005 KEL. DESA MAJU KEC. PASAR MINGGU"). 
Jika ada bidang yang tidak jelas atau kosong, beri nilai string kosong "". Tuliskan nilai sesuai huruf kapital pada KTP.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                { inline_data: { mime_type: selectedMimeType, data: selectedBase64 } }
                            ]
                        }],
                        generationConfig: {
                            response_mime_type: "application/json"
                        }
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const jsonText = data.candidates[0].content.parts[0].text;
                const resultObj = JSON.parse(jsonText);

                fieldsConfig.forEach(f => {
                    const el = document.getElementById(`field_${f.id}`);
                    if (el) el.value = resultObj[f.id] || '';
                });

            } catch (err) {
                alert('Gagal mengekstrak data: ' + err.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('btnProcess').disabled = false;
            }
        }

        function copySingleField(id, btnEl) {
            const input = document.getElementById(id);
            if (!input || !input.value) return;

            navigator.clipboard.writeText(input.value).then(() => {
                const originalHtml = btnEl.innerHTML;
                btnEl.innerHTML = '<i class="fa-solid fa-check text-green-600"></i>';
                setTimeout(() => btnEl.innerHTML = originalHtml, 1200);
            });
        }

        function copyAllText() {
            let output = [];
            fieldsConfig.forEach(f => {
                const val = document.getElementById(`field_${f.id}`).value;
                output.push(`${f.label}: ${val}`);
            });
            
            navigator.clipboard.writeText(output.join('\n')).then(() => {
                alert('Seluruh data berhasil disalin ke clipboard!');
            });
        }
    </script>
</body>
</html>
